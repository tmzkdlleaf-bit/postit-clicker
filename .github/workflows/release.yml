# package.json의 버전이 바뀐 채로 main에 올라오면, 그 버전의 릴리스가 아직 없을 때만
# 윈도우용 설치 파일을 만들어 GitHub 릴리스(v버전)에 올림. 설치된 프로그램은 여기서 새 버전을 받아감
name: release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이미 낸 버전인지 확인
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "v$V 릴리스가 이미 있어서 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - if: steps.ver.outputs.skip != 'true'
        run: npm ci

      - name: 설치 파일 만들어 올리기
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
