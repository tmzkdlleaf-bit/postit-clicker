<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>할 일</title>
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;background:transparent;overflow:hidden}
body{padding:10px}
.card{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r-l);box-shadow:var(--shadow-pop);overflow:hidden}

.top{display:flex;align-items:center;gap:4px;padding:10px 10px 6px 16px;-webkit-app-region:drag}
.top h1{margin:0;font-size:var(--fs-l);font-weight:700;flex:1}
.top h1 span{color:var(--faint);font-weight:500;margin-left:6px}
.top .btn{-webkit-app-region:no-drag}

.add{padding:4px 12px 10px}
.add .field{width:100%;height:34px;padding:0 10px}
.more{display:none;gap:6px;margin-top:6px;align-items:center}
.add.open .more{display:flex}
.more select{flex:1}
.more input[type=date]{width:128px;flex:none}
.more .time{font-size:var(--fs-s);color:var(--a11);font-weight:600;flex:none}

.list{flex:1;overflow-y:auto;border-top:var(--hair) solid var(--line-soft)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:var(--hair) solid var(--line-soft)}
.item input{width:16px;height:16px;margin:2px 0 0;flex:none;cursor:pointer}
.item .txt{flex:1;min-width:0;cursor:pointer}
.item .t{line-height:1.4;word-break:break-all}
.item .txt:hover .t{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.item.gone{opacity:0;transition:opacity var(--dur) var(--ease)}
.meta{display:flex;gap:10px;margin-top:2px;font-size:var(--fs-s);color:var(--muted)}
.meta .over{color:var(--danger);font-weight:600}
.meta .soon{color:var(--a11);font-weight:600}
.item.hi .t{font-weight:600}
.item.done .t{text-decoration:line-through;color:var(--faint)}
.empty{padding:40px 16px;text-align:center;color:var(--faint)}

.doneHead{display:flex;align-items:center;gap:6px;width:100%;height:38px;padding:0 16px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left}
.doneHead:hover{color:var(--text)}
.doneHead i{font-style:normal;display:inline-block;transition:rotate var(--dur) var(--ease)}
.doneHead.open i{rotate:90deg}

.toast{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:40px;
  border-radius:var(--r-m);background:var(--s12);color:var(--s1);opacity:0;translate:0 8px;pointer-events:none;
  transition:opacity var(--dur) var(--ease),translate var(--dur) var(--ease)}
.toast.show{opacity:1;translate:0 0;pointer-events:auto}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{height:30px;padding:0 10px;border:0;border-radius:var(--r-s);background:none;color:var(--a9);font-weight:600;cursor:pointer}
.toast button:hover{background:rgb(255 255 255 / .08)}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <h1>할 일<span id="cnt"></span></h1>
    <button class="btn ghost" id="openBoard">판 열기</button>
    <button class="btn ghost icon" id="close" aria-label="닫기">✕</button>
  </div>
  <div class="add" id="add">
    <input class="field" type="text" id="newText" placeholder="할 일 추가" autocomplete="off">
    <div class="more">
      <select class="field" id="newBoard" aria-label="판"></select>
      <input class="field" type="date" id="newDue" aria-label="마감">
      <span class="time" id="newTime"></span>
      <button class="btn primary" id="addBtn">추가</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="toast" id="toast"><span id="toastText"></span><button id="undo">되돌리기</button></div>
</div>
<script src="shared.js"></script>
<script>
const $ = s => document.querySelector(s);
let data = null, doneOpen = false;
const save = () => Shared.Store.save({ state: data.state });
const goTo = it => window.api && api.open('board', { noteId: it.noteId, blockId: it.id });

function metaEl(it) {
  const meta = document.createElement('div'); meta.className = 'meta';
  if (it.due) {
    const d = document.createElement('span'); d.textContent = Shared.dueLabel(it.due);
    if (it.days < 0) d.className = 'over'; else if (it.days <= 1) d.className = 'soon';
    meta.append(d);
  }
  const bn = document.createElement('span'); bn.textContent = it.boardName; meta.append(bn);
  return meta;
}
function row(it, done) {
  const r = document.createElement('div'); r.className = 'item' + (done ? ' done' : (it.weight >= 3.5 ? ' hi' : ''));
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = done; cb.setAttribute('aria-label', '완료');
  cb.onchange = () => {
    if (!done) { r.classList.add('gone'); Shared.setDone(data.state, it.id, true); save(); toast(it); setTimeout(render, 250); }
    else { Shared.setDone(data.state, it.id, false); save(); render(); }
  };
  const txt = document.createElement('div'); txt.className = 'txt'; txt.title = '판에서 보기';
  const t = document.createElement('div'); t.className = 't'; t.textContent = it.text;
  txt.append(t); if (!done) txt.append(metaEl(it));
  txt.onclick = () => goTo(it);
  r.append(cb, txt);
  return r;
}

function render() {
  const items = Shared.collect(data.state, data.settings);
  $('#cnt').textContent = items.length || '';
  const sel = $('#newBoard'), keep = sel.value;
  sel.innerHTML = '';
  [...data.state.boards].sort((a, b) => a.order - b.order).forEach(b => {
    const o = document.createElement('option'); o.value = b.id; o.textContent = b.name; sel.append(o);
  });
  sel.value = data.state.boards.some(b => b.id === keep) ? keep : data.state.current;

  const list = $('#list'); list.innerHTML = '';
  if (!items.length) list.innerHTML = '<div class="empty">할 일이 없어요</div>';
  items.forEach(it => list.append(row(it, false)));

  const done = Shared.doneToday(data.state);
  if (done.length) {
    const h = document.createElement('button'); h.className = 'doneHead' + (doneOpen ? ' open' : '');
    h.innerHTML = '<i>›</i>'; h.append(document.createTextNode(`오늘 끝낸 일 ${done.length}`));
    h.onclick = () => { doneOpen = !doneOpen; render(); };
    list.append(h);
    if (doneOpen) done.forEach(it => list.append(row(it, true)));
  }
}

/* 되돌리기 */
let toastT, lastDone = null;
function toast(it) {
  lastDone = it;
  $('#toastText').textContent = `「${it.text}」 완료`;
  $('#toast').classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('show'), 5000);
}
$('#undo').onclick = () => {
  if (!lastDone) return;
  Shared.setDone(data.state, lastDone.id, false); save(); lastDone = null;
  $('#toast').classList.remove('show'); render();
};

/* 추가: 글 안의 날짜는 알아서 마감으로 */
let manualDate = false, parsed = { text: '', due: null };
function onType() {
  const v = $('#newText').value;
  $('#add').classList.toggle('open', !!v.trim());
  if (manualDate) return;
  parsed = Shared.parseQuick(v);
  $('#newDue').value = parsed.due ? parsed.due.slice(0, 10) : '';
  $('#newTime').textContent = parsed.due && parsed.due.length > 10 ? parsed.due.slice(11) : '';
}
function addItem() {
  const raw = $('#newText').value.trim(); if (!raw) return;
  let text = raw, due = $('#newDue').value || null;
  if (!manualDate && parsed.due) { text = parsed.text; due = parsed.due; }
  Shared.addQuickItem(data.state, $('#newBoard').value, text, due, data.settings.notePalette);
  save();
  $('#newText').value = ''; $('#newDue').value = ''; $('#newTime').textContent = '';
  manualDate = false; parsed = { text: '', due: null };
  $('#add').classList.remove('open');
  render(); $('#newText').focus();
}
$('#newText').addEventListener('input', onType);
$('#newDue').addEventListener('input', () => { manualDate = true; $('#newTime').textContent = ''; });
$('#newText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); addItem(); } });
$('#addBtn').onclick = addItem;
$('#close').onclick = () => window.api && api.hideList();
$('#openBoard').onclick = () => window.api && api.open('board');
document.addEventListener('keydown', e => { if (e.key === 'Escape' && window.api) api.hideList(); });

(async () => {
  data = await Shared.Store.load();
  render();
  Shared.Store.onChange(d => { data = d; render(); });
  if (window.api) api.onListShow(d => { data = Shared.normalize(d); render(); $('#newText').focus(); });
})();
</script>
</body>
</html>
